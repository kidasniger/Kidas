name: Rendu vidéo
run-name: Rendu ${{ inputs.tag || inputs.fichier }}

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier HTML à convertir"
        required: true
        default: "kidas.html"
      fps:
        description: "Images par seconde"
        default: "30"
      scale:
        description: "Échelle (1 = 1080x1920, 0.5 = 540x960)"
        default: "1"
      test:
        description: "Secondes à rendre (0 = vidéo entière)"
        default: "0"
      duration:
        description: "Durée maximale en secondes (0 = détection automatique)"
        required: false
        default: "0"
      fallback_duration:
        description: "Durée de secours si aucune durée n'est détectée"
        type: choice
        options:
          - "10"
          - "30"
          - "60"
          - "120"
          - "300"
        required: false
        default: "60"
      format:
        description: "Format de sortie"
        type: choice
        options:
          - auto
          - portrait
          - landscape
          - square
        required: false
        default: "auto"
      tag:
        description: "Identifiant de la vidéo (rempli par la page web)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le HTML importé depuis la branche dédiée
        env:
          FICHIER: ${{ inputs.fichier }}
        run: |
          case "$FICHIER" in
            uploads/*)
              git fetch --no-tags origin video-uploads
              mkdir -p "$(dirname "$FICHIER")"
              git show "FETCH_HEAD:$FICHIER" > "$FICHIER"
              ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer le fichier importé
        env:
          FICHIER: ${{ inputs.fichier }}
        run: |
          if [ ! -f "$FICHIER" ]; then
            git fetch --depth=1 origin uploads
            git checkout FETCH_HEAD -- "$FICHIER"
          fi

      - name: Installer FFmpeg et les dépendances
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q websocket-client

      - name: Rendre la vidéo
        env:
          FICHIER: ${{ inputs.fichier }}
          FPS: ${{ inputs.fps }}
          SCALE: ${{ inputs.scale }}
          TEST: ${{ inputs.test }}
          DURATION: ${{ inputs.duration }}
          FALLBACK_DURATION: ${{ inputs.fallback_duration }}
          FORMAT: ${{ inputs.format }}
        run: python html2mp4.py --file "$FICHIER" --fps "$FPS" --scale "$SCALE" --test "$TEST" --duration "$DURATION" --fallback-duration "$FALLBACK_DURATION" --format "$FORMAT"

      - name: Publier le MP4 (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: "**/*.mp4"
          if-no-files-found: error

      - name: Publier le MP4 (Release, pour la page web)
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" $(find . -name '*.mp4' -not -path './.git/*') \
            --title "Vidéo $TAG" --notes "Générée par le workflow Rendu vidéo."
