name: Rendu vidéo
run-name: Rendu ${{ inputs.tag || inputs.fichier }}

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier HTML à convertir"
        required: true
        default: "kidas.html"
      fps:
        description: "Images par seconde"
        default: "30"
      scale:
        description: "Échelle (1 = 1080x1920, 0.5 = 540x960)"
        default: "1"
      test:
        description: "Secondes à rendre (0 = vidéo entière)"
        default: "0"
      duration:
        description: "Durée maximale en secondes (0 = durée détectée, sinon 60 s en mode universel)"
        required: false
        default: "0"
      format:
        description: "Format de sortie"
        type: choice
        options:
          - auto
          - portrait
          - landscape
          - square
        required: false
        default: "auto"
      nom:
        description: "Nom du MP4 (défaut : nom du fichier HTML)"
        required: false
        default: ""
      qualite:
        description: "Qualité d'encodage"
        type: choice
        options:
          - standard
          - fast
          - high
        required: false
        default: "standard"
      loudnorm:
        description: "Normaliser le volume (-16 LUFS)"
        type: boolean
        required: false
        default: false
      tag:
        description: "Identifiant de la vidéo (rempli par la page web)"
        required: false
        default: ""
      blob_id:
        description: "Identifiant du HTML temporaire dans le stockage privé"
        required: false
        default: ""
      cleanup_url:
        description: "URL de nettoyage temporaire fournie par le site"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le HTML source
        id: source
        env:
          FICHIER: ${{ inputs.fichier }}
          BLOB_ID: ${{ inputs.blob_id }}
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$BLOB_ID" ]; then
            [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
            : "${BLOB_STORE_ID:?Le secret GitHub BLOB_STORE_ID est requis}"
            : "${BLOB_READ_WRITE_TOKEN:?Le secret GitHub BLOB_READ_WRITE_TOKEN est requis}"
            mkdir -p .kidas-tmp
            BLOB_URL="https://${BLOB_STORE_ID}.private.blob.vercel-storage.com/incoming/${BLOB_ID}.html"
            curl --fail --silent --show-error --location --retry 2 \
              --header "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              "$BLOB_URL" --output .kidas-tmp/input.html
            echo "fichier=.kidas-tmp/input.html" >> "$GITHUB_OUTPUT"
          else
            case "$FICHIER" in
              uploads/*)
                git fetch --no-tags origin video-uploads
                mkdir -p "$(dirname "$FICHIER")"
                git show "FETCH_HEAD:$FICHIER" > "$FICHIER"
                ;;
            esac
            if [ ! -f "$FICHIER" ]; then
              git fetch --depth=1 origin uploads
              git checkout FETCH_HEAD -- "$FICHIER"
            fi
            echo "fichier=$FICHIER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer FFmpeg et les dépendances
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q websocket-client

      - name: Rendre la vidéo
        env:
          FICHIER: ${{ steps.source.outputs.fichier }}
          FPS: ${{ inputs.fps }}
          SCALE: ${{ inputs.scale }}
          TEST: ${{ inputs.test }}
          DURATION: ${{ inputs.duration }}
          FORMAT: ${{ inputs.format }}
          NOM: ${{ inputs.nom }}
          QUALITE: ${{ inputs.qualite }}
          LOUDNORM: ${{ inputs.loudnorm }}
        run: |
          EXTRA=""
          [ "$LOUDNORM" = "true" ] && EXTRA="--loudnorm"
          python html2mp4.py --file "$FICHIER" --fps "$FPS" --scale "$SCALE" --test "$TEST" --duration "$DURATION" --format "$FORMAT" --name "$NOM" --quality "$QUALITE" $EXTRA

      - name: Publier le MP4 (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: "**/*.mp4"
          if-no-files-found: error

      - name: Publier le MP4 (Release, pour la page web)
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" $(find . -name '*.mp4' -not -path './.git/*') \
            --title "Vidéo $TAG" --notes "Générée par le workflow Rendu vidéo."
      - name: Supprimer les fichiers temporaires
        if: always()
        env:
          BLOB_ID: ${{ inputs.blob_id }}
          CLEANUP_URL: ${{ inputs.cleanup_url }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          rm -rf .kidas-tmp
          if [ -n "$BLOB_ID" ] && [ -n "$CLEANUP_URL" ] && [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            curl --fail --silent --show-error --location --retry 2 \
              -X POST "$CLEANUP_URL" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"id\":\"${BLOB_ID}\"}" \
              || echo "::warning::Le nettoyage du HTML privé a échoué; réessaie via la page de rendu."
          fi
