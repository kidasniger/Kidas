name: Rendu vidéo
run-name: Rendu ${{ inputs.tag || inputs.fichier }}

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier HTML à convertir"
        required: true
        default: "kidas.html"
      fps:
        description: "Images par seconde"
        default: "30"
      scale:
        description: "Échelle (1 = 1080x1920, 0.5 = 540x960)"
        default: "1"
      test:
        description: "Secondes à rendre (0 = vidéo entière)"
        default: "0"
      duration:
        description: "Durée maximale en secondes (0 = durée détectée, sinon 60 s en mode universel)"
        required: false
        default: "0"
      format:
        description: "Format de sortie"
        type: choice
        options:
          - auto
          - portrait
          - landscape
          - square
        required: false
        default: "auto"
      nom:
        description: "Nom du MP4 (défaut : nom du fichier HTML)"
        required: false
        default: ""
      qualite:
        description: "Qualité d'encodage"
        type: choice
        options:
          - standard
          - fast
          - high
        required: false
        default: "standard"
      loudnorm:
        description: "Normaliser le volume (-16 LUFS)"
        type: boolean
        required: false
        default: false
      tag:
        description: "Identifiant de la vidéo (rempli par la page web)"
        required: false
        default: ""
      blob_id:
        description: "Identifiant du HTML temporaire dans le stockage privé"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le HTML source
        id: source
        env:
          FICHIER: ${{ inputs.fichier }}
          BLOB_ID: ${{ inputs.blob_id }}
        run: |
          set -euo pipefail
          if [ -n "$BLOB_ID" ]; then
            [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
            : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC indisponible; vérifie id-token: write}"
            : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC indisponible; vérifie id-token: write}"
            OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
            OIDC_TOKEN="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$OIDC_REQUEST_URL" | jq -er '.value')"
            echo "::add-mask::${OIDC_TOKEN}"
            mkdir -p kidas-tmp
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              "https://rendrax.vercel.app/api/runner-source?id=${BLOB_ID}&run_id=${GITHUB_RUN_ID}" \
              --output kidas-tmp/input.html
            test -s kidas-tmp/input.html || { echo "::error::Le HTML temporaire est vide."; exit 1; }
            echo "fichier=kidas-tmp/input.html" >> "$GITHUB_OUTPUT"
          else
            case "$FICHIER" in
              uploads/*)
                git fetch --no-tags origin video-uploads
                mkdir -p "$(dirname "$FICHIER")"
                git show "FETCH_HEAD:$FICHIER" > "$FICHIER"
                ;;
            esac
            if [ ! -f "$FICHIER" ]; then
              git fetch --depth=1 origin uploads
              git checkout FETCH_HEAD -- "$FICHIER"
            fi
            echo "fichier=$FICHIER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer FFmpeg et les dépendances
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q websocket-client

      - name: Rendre la vidéo
        env:
          FICHIER: ${{ steps.source.outputs.fichier }}
          FPS: ${{ inputs.fps }}
          SCALE: ${{ inputs.scale }}
          TEST: ${{ inputs.test }}
          DURATION: ${{ inputs.duration }}
          FORMAT: ${{ inputs.format }}
          NOM: ${{ inputs.nom }}
          QUALITE: ${{ inputs.qualite }}
          LOUDNORM: ${{ inputs.loudnorm }}
        run: |
          EXTRA=""
          if [ "$LOUDNORM" = "true" ]; then EXTRA="--loudnorm"; fi
          python html2mp4.py --file "$FICHIER" --fps "$FPS" --scale "$SCALE" --test "$TEST" --duration "$DURATION" --format "$FORMAT" --name "$NOM" --quality "$QUALITE" $EXTRA

      - name: Publier le MP4 (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: "**/*.mp4"
          if-no-files-found: error

      - name: Publier le MP4 (Release, pour la page web)
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" $(find . -name '*.mp4' -not -path './.git/*') \
            --title "Vidéo $TAG" --notes "Générée par le workflow Rendu vidéo."
      - name: Supprimer les fichiers temporaires
        if: always()
        env:
          BLOB_ID: ${{ inputs.blob_id }}
        run: |
          rm -rf kidas-tmp
          if [ -n "$BLOB_ID" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::warning::OIDC indisponible; le HTML privé doit être supprimé depuis le stockage Vercel."
              exit 0
            fi
            OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
            if ! OIDC_TOKEN="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$OIDC_REQUEST_URL" | jq -er '.value')"; then
              echo "::warning::Impossible d’obtenir le jeton OIDC pour le nettoyage."
              exit 0
            fi
            echo "::add-mask::${OIDC_TOKEN}"
            curl --fail --silent --show-error --location --retry 2 \
              -X POST "https://rendrax.vercel.app/api/cleanup" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"id\":\"${BLOB_ID}\",\"run_id\":\"${GITHUB_RUN_ID}\"}" \
              || echo "::warning::Le nettoyage du HTML privé a échoué; vérifie les journaux Vercel."
          fi
