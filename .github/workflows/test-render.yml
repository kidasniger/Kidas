name: Tests du convertisseur HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: html-render-regression
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer FFmpeg et les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install websocket-client
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Rendus de régression HTML/CSS/Canvas/Web Audio
        run: |
          set -euo pipefail
          python html2mp4.py --file kidas.html --fps 10 --scale 0.5 --test 2 --duration 2 --format auto
          python html2mp4.py --file uploads/vmv7j3erf.html --fps 10 --scale 0.5 --test 2 --duration 2 --format portrait
          for file in tests/fixtures/css-animation.html tests/fixtures/canvas-animation.html tests/fixtures/webaudio.html tests/fixtures/static.html tests/fixtures/start-button.html tests/fixtures/gsap-audio-timeline.html; do
            python html2mp4.py --file "$file" --fps 10 --scale 0.5 --test 2 --duration 2 --format landscape
          done
          python html2mp4.py --file tests/fixtures/start-overlay.html --fps 10 --scale 0.5 --test 2 --duration 2 --format landscape 2>&1 | tee /tmp/rendrax-start-overlay.log
          grep -q "Bouton de démarrage activé automatiquement" /tmp/rendrax-start-overlay.log
          for file in kidas_test.mp4 uploads/vmv7j3erf_test.mp4 tests/fixtures/css-animation_test.mp4 tests/fixtures/canvas-animation_test.mp4 tests/fixtures/webaudio_test.mp4 tests/fixtures/static_test.mp4 tests/fixtures/start-button_test.mp4 tests/fixtures/start-overlay_test.mp4 tests/fixtures/gsap-audio-timeline_test.mp4; do
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$file"
          done
          test -n "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 tests/fixtures/webaudio_test.mp4)"
          test -n "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 tests/fixtures/gsap-audio-timeline_test.mp4)"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 tests/fixtures/gsap-audio-timeline_test.mp4)" = "60/1"
          echo "KIDAS v2, EditPro, CSS, Canvas, Web Audio et HTML statique ont produit une vidéo."
