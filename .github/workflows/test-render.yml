name: Tests du convertisseur HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: html-render-regression
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer FFmpeg et ffprobe (binaires statiques en cache)
        timeout-minutes: 6
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        with:
          ffmpeg-version: release

      - name: Vérifier les outils média
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Installer websocket-client
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --no-input --retries 2 --timeout 20 websocket-client Pillow
          python -c "import websocket; print('websocket-client installé:', websocket.__version__)"
          python -c "import PIL; print('Pillow installé:', PIL.__version__)"
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Rendus de régression HTML/CSS/Canvas/Web Audio
        run: |
          set -euo pipefail
          python html2mp4.py --file kidas.html --fps auto --scale 0.5 --test 2 --duration 2 --format auto --quality auto
          python html2mp4.py --file uploads/vmv7j3erf.html --fps auto --scale 0.5 --test 2 --duration 2 --format portrait --quality auto
          for file in tests/fixtures/css-animation.html tests/fixtures/canvas-animation.html tests/fixtures/webaudio.html tests/fixtures/static.html tests/fixtures/start-button.html tests/fixtures/gsap-audio-timeline.html tests/fixtures/gsap-duration-audio-timeline.html; do
            python html2mp4.py --file "$file" --fps auto --scale 0.5 --test 2 --duration 2 --format landscape --quality auto
          done
          python html2mp4.py --file tests/fixtures/start-overlay.html --fps auto --scale 0.5 --test 2 --duration 2 --format landscape --quality auto 2>&1 | tee /tmp/rendrax-start-overlay.log
          grep -q "Bouton de démarrage activé automatiquement" /tmp/rendrax-start-overlay.log
          for file in kidas_test.mp4 uploads/vmv7j3erf_test.mp4 tests/fixtures/css-animation_test.mp4 tests/fixtures/canvas-animation_test.mp4 tests/fixtures/webaudio_test.mp4 tests/fixtures/static_test.mp4 tests/fixtures/start-button_test.mp4 tests/fixtures/start-overlay_test.mp4 tests/fixtures/gsap-audio-timeline_test.mp4 tests/fixtures/gsap-duration-audio-timeline_test.mp4; do
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$file"
          done
          test -n "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 tests/fixtures/webaudio_test.mp4)"
          test -n "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 tests/fixtures/gsap-audio-timeline_test.mp4)"
          test -n "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 tests/fixtures/gsap-duration-audio-timeline_test.mp4)"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 tests/fixtures/gsap-audio-timeline_test.mp4)" = "60/1"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 tests/fixtures/gsap-duration-audio-timeline_test.mp4)" = "60/1"
          video_duration="$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 tests/fixtures/gsap-audio-timeline_test.mp4)"
          audio_duration="$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 tests/fixtures/gsap-audio-timeline_test.mp4)"
          awk -v v="$video_duration" -v a="$audio_duration" 'BEGIN { d=v-a; if (d<0) d=-d; exit !(d<=0.08) }'
          unique_frames="$(ffmpeg -v error -i tests/fixtures/gsap-audio-timeline_test.mp4 -map 0:v:0 -f framemd5 - 2>/dev/null | awk '!/^#/ {print $NF}' | sort -u | wc -l)"
          echo "Images distinctes dans le test GSAP : $unique_frames"
          test "$unique_frames" -ge 10
          duration_unique_frames="$(ffmpeg -v error -i tests/fixtures/gsap-duration-audio-timeline_test.mp4 -map 0:v:0 -f framemd5 - 2>/dev/null | awk '!/^#/ {print $NF}' | sort -u | wc -l)"
          echo "Images distinctes dans le test GSAP D sans T : $duration_unique_frames"
          test "$duration_unique_frames" -ge 10
          echo "Tests terminés : profils synchronisés, CSS, Canvas, Web Audio, audio/durée, cadence 60 i/s et mouvement GSAP vérifiés."
