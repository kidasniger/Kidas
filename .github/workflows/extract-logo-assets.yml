name: Extract logo archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-logo-assets.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract logo.zip into logo/
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path("logo.zip")
          target_root = Path("logo")
          target_root.mkdir(parents=True, exist_ok=True)

          written = []
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  relative = PurePosixPath(name)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe path in archive: {name!r}")
                  if not relative.parts or "__MACOSX" in relative.parts or relative.name == ".DS_Store":
                      continue
                  if info.is_dir():
                      continue
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Refusing symlink in archive: {name!r}")
                  destination = target_root.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(zf.read(info))
                  written.append(destination.as_posix())

          if not written:
              raise SystemExit("No files were extracted from logo.zip")
          print("Extracted files:")
          for name in written:
              print(f" - {name}")
          PY
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo/
          if git diff --cached --quiet; then
            echo "No extracted files to commit."
            exit 1
          fi
          git commit -m "Extract logo assets into logo/"
          git push origin HEAD:main
