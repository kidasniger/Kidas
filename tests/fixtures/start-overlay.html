<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test de zone de démarrage</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:#fff;font:24px system-ui,sans-serif}
#scene{width:100vw;height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#122044,#41206b)}
#shape{width:90px;height:90px;border-radius:25px;background:#fff;transform:translateX(-120px);opacity:.5}
#scene.started #shape{animation:travel 1.2s ease-in-out infinite alternate}
@keyframes travel{to{transform:translateX(120px) rotate(180deg);opacity:1;background:#34d9bb}}
#go{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(8,11,24,.92);cursor:pointer;z-index:9;font-size:28px}
#go i{font-style:normal;font-size:72px}
</style>
</head>
<body>
<div id="scene"><div id="shape"></div></div>
<div id="go"><i>▶</i><span>Lancer la vidéo</span></div>
<script>
const go=document.querySelector('#go');
go.onclick=()=>{go.style.display='none';document.querySelector('#scene').classList.add('started');};
</script>
</body>
</html>
