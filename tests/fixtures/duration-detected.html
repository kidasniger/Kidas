<!doctype html>
<html lang="fr" data-duration="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture de durée automatique</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b3d;color:#fff;font:700 48px system-ui}
#scene{height:100%;display:grid;place-items:center}
#dot{width:80px;height:80px;border-radius:50%;background:#ffcf55;animation:move 2s linear infinite alternate}
@keyframes move{from{transform:translateX(-250px)}to{transform:translateX(250px)}}
</style>
</head>
<body>
<div id="scene"><div><div id="dot"></div><p>Durée détectée : 2 s</p></div></div>
</body>
</html>
