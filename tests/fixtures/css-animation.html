<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152d}
main{width:100vw;height:100vh;display:grid;place-items:center}
.ball{width:90px;height:90px;border-radius:22px;background:#35d0ba;animation:move 1.5s ease-in-out infinite alternate}
@keyframes move{from{transform:translateX(-260px) rotate(0deg)}to{transform:translateX(260px) rotate(180deg)}}
</style></head><body><main><div class="ball"></div></main></body></html>
